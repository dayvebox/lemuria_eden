<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VTS Aldabra - Surveillance Flotte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1117;
            --panel-color: #161b22;
            --accent: #00d4ff;
            --text: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background-color: #1e293b;
            color: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 9999;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background-color: var(--accent);
            color: #0f172a;
            transform: scale(1.1);
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            z-index: 10;
        }

        /* --- ÉCRAN 1 : AUTHENTIFICATION (DEUX COLONNES) --- */
        #auth-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #161b22 0%, #0b1117 100%);
        }

        .auth-card {
            background: var(--panel-color);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 90%;
        }

        .auth-layout {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 40px;
            align-items: center;
            margin-top: 30px;
        }

        .auth-divider {
            background-color: #30363d;
            height: 100%;
            width: 100%;
        }

        .auth-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .id-input {
            background: #0d1117;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            width: 150px;
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            outline: none;
            border-radius: 4px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
            max-width: 250px;
        }

        .btn:hover { background: var(--accent); color: #000; }

        .btn-global {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            gap: 15px;
        }

        /* --- MODAL CARTE GLOBALE --- */
        #global-map-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #global-map-overlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }

        .close-hint {
            position: absolute;
            bottom: 20px;
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* --- ÉCRAN 2 : CARTE (RESTE INCHANGÉ) --- */
        #map-screen {
            display: none;
            flex: 1;
            grid-template-columns: 300px 1fr;
        }

        .sidebar {
            background: var(--panel-color);
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-btn {
            background: #0d1117;
            border: 1px solid #30363d;
            color: var(--text);
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .log-btn:hover { border-color: var(--accent); }
        .log-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .map-area {
            position: relative;
            background-color: #0b1117;
            background-image: linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
        }

        .island-img {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            opacity: 0.7;
        }

        #boat {
            position: absolute;
            width: 40px;
            z-index: 100;
            display: none;
            transition: all 0.7s ease-in-out;
        }

        @media (max-width: 600px) {
            .auth-layout { grid-template-columns: 1fr; }
            .auth-divider { height: 1px; }
        }
    </style>
</head>
<body>

<a href="index.html" class="home-btn" title="Retour à l'accueil">
    <i class="fas fa-home"></i>
</a>

<header>
    <div style="font-weight: 800; letter-spacing: 2px; color: var(--accent);">VTS ALDABRA : TRACKING SYSTEM</div>
</header>

<div id="auth-screen">
    <div class="auth-card">
        <div style="font-size: 0.8rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;">Terminal de Surveillance des Seychelles</div>
        
        <div class="auth-layout">
            <div class="auth-column">
                <p style="font-size: 0.9rem; margin-bottom: 20px;">Consulter la zone de navigation globale</p>
                <button class="btn btn-global" onclick="openGlobalMap()">
                    <i class="fas fa-map"></i> Carte Globale
                </button>
            </div>

            <div class="auth-divider"></div>

            <div class="auth-column">
                <p style="font-size: 0.9rem;">Analyser les logs d'un navire spécifique</p>
                <input type="text" id="boatID" class="id-input" placeholder="ID" maxlength="3" onkeypress="handleEnter(event)">
                <button class="btn" onclick="verifyID()">Démarrer l'analyse</button>
            </div>
        </div>
    </div>
</div>

<div id="global-map-overlay" onclick="closeGlobalMap()">
    <img src="assets/seychelles.jpg" alt="Carte des Seychelles">
    <div class="close-hint">Cliquer n'importe où pour fermer</div>
</div>

<div id="map-screen">
    <div class="sidebar">
        <h3 style="font-size: 0.9rem; margin-bottom: 20px; color: var(--accent);">LOGS RÉCENTS : ID 356</h3>
        <button class="log-btn" onclick="runAnimation(this)">21/09 - 06:01:14</button>
        <button class="log-btn" onclick="runAnimation(this)">22/09 - 05:58:42</button>
        <button class="log-btn" onclick="runAnimation(this)">23/09 - 06:02:10</button>
        <button class="log-btn" onclick="runAnimation(this)">24/09 - 05:59:05</button>
        
        <div style="margin-top: auto; font-size: 0.7rem; color: #444;">
            <i class="fas fa-satellite"></i> Liaison satellite active<br>
            Station : Aldabra-North-East
        </div>
    </div>

    <div class="map-area">
        <img src="assets/carte.png" class="island-img" alt="Carte de l'île">
        <img id="boat" src="assets/bateau.png" alt="Navire 356">
    </div>
</div>

<script>
    function openGlobalMap() {
        document.getElementById('global-map-overlay').style.display = 'flex';
    }

    function closeGlobalMap() {
        document.getElementById('global-map-overlay').style.display = 'none';
    }

    function handleEnter(e) {
        if (e.key === 'Enter') verifyID();
    }

    function verifyID() {
        const input = document.getElementById('boatID').value.trim();
        if (input === "356") {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'grid'; 
        } else {
            alert("ID Navire inconnu. Accès refusé.");
            document.getElementById('boatID').value = "";
        }
    }

    const grid = {
        "A1": { x: 58, y: 55 },
        "C1": { x: 66, y: 55 },
        "C3": { x: 66, y: 73 },
        "B2": { x: 62, y: 65 },
        "A3": { x: 58, y: 73 },
        "A1_FIN": { x: 58, y: 55 }
    };

    const path = ["A1", "C1", "C3", "B2", "A3", "A1_FIN"];

    async function runAnimation(btn) {
        document.querySelectorAll('.log-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const boat = document.getElementById('boat');
        boat.style.display = "block";

        for (let step of path) {
            const pos = grid[step];
            boat.style.left = pos.x + "%";
            boat.style.top = pos.y + "%";
            // CORRECTION : On garde translate pour le centrage, mais on supprime rotate()
            boat.style.transform = `translate(-50%, -50%)`;
            await new Promise(resolve => setTimeout(resolve, 800));
        }
    }
</script>

</body>
</html>
