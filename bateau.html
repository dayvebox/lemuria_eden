<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTS Aldabra - Surveillance Flotte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1117;
            --panel-color: #161b22;
            --accent: #00d4ff;
            --text: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- BOUTON HOME --- */
        .home-btn {
            position: fixed;
            top: 20px; left: 20px;
            width: 50px; height: 50px;
            background-color: #1e293b;
            color: #f1f5f9;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10001;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .home-btn:hover { background-color: var(--accent); color: #0f172a; transform: scale(1.1); }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            z-index: 10;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* --- ÉCRAN 1 : CHOIX (DEUX COLONNES) --- */
        #auth-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #161b22 0%, #0b1117 100%);
        }

        .auth-card {
            background: var(--panel-color);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 90%;
        }

        .auth-layout {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 40px;
            align-items: center;
            margin-top: 30px;
        }

        .auth-divider { background-color: #30363d; height: 100%; width: 1px; }

        .auth-column { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .id-input {
            background: #0d1117;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            width: 150px;
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            outline: none;
            border-radius: 4px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover { background: var(--accent); color: #000; }

        /* --- ÉCRAN 2 : TRACKING NAVIRE --- */
        #map-screen {
            display: none;
            flex: 1;
            grid-template-columns: 300px 1fr;
        }

        .sidebar {
            background: var(--panel-color);
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-btn {
            background: #0d1117;
            border: 1px solid #30363d;
            color: var(--text);
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .log-btn:hover { border-color: var(--accent); }
        .log-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        .map-area {
            position: relative;
            background-color: #0b1117;
            background-image: linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .island-img {
            max-width: 90%;
            max-height: 90%;
            opacity: 0.7;
            pointer-events: none;
        }

        #boat {
            position: absolute;
            width: 40px;
            z-index: 100;
            display: none;
            transition: all 0.8s ease-in-out; /* Animation fluide */
            pointer-events: none;
        }

        /* --- ÉCRAN 3 : CARTE INTERACTIVE DES DISTANCES --- */
        #interactive-map-screen {
            display: none;
            flex: 1;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 50%, #0a1926 0%, #050a0f 100%),
                linear-gradient(rgba(0,212,255,0.05) 2px, transparent 2px), 
                linear-gradient(90deg, rgba(0,212,255,0.05) 2px, transparent 2px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            touch-action: none; /* Désactive le scroll mobile pendant le tracé */
        }

        .island { position: absolute; z-index: 10; cursor: pointer; transform: translate(-50%, -50%); text-align: center; }
        .island svg { fill: rgba(0, 212, 255, 0.1); stroke: var(--accent); stroke-width: 1.2; transition: 0.3s; }
        .island.active svg { fill: rgba(0, 212, 255, 0.5); transform: scale(1.1); }
        .label-mahe { font-size: 0.75rem; color: #fff; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 4px; margin-top: 5px; white-space: nowrap; border: 1px solid var(--accent); pointer-events: none; }

        #distance-hud {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--accent);
            padding: 15px; min-width: 200px; border-radius: 4px; z-index: 20; pointer-events: none;
        }

        .hud-val { font-size: 1.8rem; font-weight: bold; color: #fff; font-family: monospace; }
        .hud-label { font-size: 0.65rem; color: var(--accent); opacity: 0.8; letter-spacing: 1px; text-transform: uppercase;}

        canvas#lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

        @media (max-width: 768px) {
            .auth-layout { grid-template-columns: 1fr; }
            .auth-divider { height: 1px; width: 100%; }
            #map-screen { grid-template-columns: 1fr; }
            .sidebar { order: 2; height: auto; }
        }
    </style>
</head>
<body>

<a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>

<header>VTS ALDABRA : TRACKING SYSTEM</header>

<div id="auth-screen">
    <div class="auth-card">
        <div style="font-size: 0.8rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;">Station de Surveillance Maritime</div>
        <div class="auth-layout">
            <div class="auth-column">
                <p style="font-size: 0.9rem; margin-bottom: 20px;">Calculateur de trajectoire & Cartographie</p>
                <button class="btn" onclick="showInteractiveMap()">
                    <i class="fas fa-map-marked-alt"></i> Ouvrir la Carte
                </button>
            </div>
            <div class="auth-divider"></div>
            <div class="auth-column">
                <p style="font-size: 0.9rem;">Logs d'activité navire</p>
                <input type="text" id="boatID" class="id-input" placeholder="ID" maxlength="3" onkeypress="handleEnter(event)">
                <button class="btn" onclick="verifyID()">Analyser Navire</button>
            </div>
        </div>
    </div>
</div>

<div id="map-screen">
    <div class="sidebar">
        <h3 style="font-size: 0.8rem; color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 10px;">ID 356 : HISTORIQUE GPS</h3>
        <button class="log-btn" onclick="runAnimation(this)">21/09 - 06:01:14</button>
        <button class="log-btn" onclick="runAnimation(this)">22/09 - 05:58:42</button>
        <button class="log-btn" onclick="runAnimation(this)">23/09 - 06:02:10</button>
        <button class="log-btn" onclick="runAnimation(this)">24/09 - 05:59:05</button>
        <div style="margin-top: auto; font-size: 0.65rem; color: #444; border-top: 1px solid #30363d; padding-top: 10px;">
            <i class="fas fa-satellite"></i> Liaison satellite active
        </div>
    </div>
    <div class="map-area">
        <img src="assets/carte.png" class="island-img" alt="Carte">
        <img id="boat" src="assets/bateau.png" alt="Bateau">
    </div>
</div>

<div id="interactive-map-screen">
    <canvas id="lineCanvas"></canvas>
    
    <div class="island" id="aldabra" style="left: 15%; top: 80%;">
        <svg width="70" height="45" viewBox="0 0 60 40">
            <path d="M5,15 Q20,-5 40,5 L55,10 Q60,20 50,30 L40,35 Q20,40 5,30 Z M15,18 L18,18 Q30,8 45,15 L48,15 L48,22 Q30,28 18,22 Z" />
        </svg>
    </div>

    <div class="island" id="mahe" style="left: 82%; top: 25%;">
        <svg width="40" height="65" viewBox="0 0 45 70">
            <path d="M10,5 L25,5 Q35,15 30,30 L35,45 Q40,55 30,65 L15,65 Q5,55 10,45 L5,30 Q0,15 10,5 Z" />
        </svg>
        <div class="label-mahe">Mahé - Capitale des Seychelles</div>
    </div>

    <div class="island" id="silhouette" style="left: 77%; top: 23%;">
        <svg width="35" height="35" viewBox="0 0 30 30"><path d="M15,2 L28,15 L22,28 L8,28 L2,15 Z" /></svg>
    </div>

    <div class="island" id="bird" style="left: 80%; top: 10%;">
        <svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" /></svg>
    </div>

    <div class="island" id="coetivy" style="left: 90%; top: 60%;">
        <svg width="20" height="70" viewBox="0 0 15 60"><ellipse cx="7.5" cy="30" rx="6" ry="28" /></svg>
    </div>

    <div class="island" id="alphonse" style="left: 55%; top: 60%;">
        <svg width="28" height="28" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" /><circle cx="15" cy="15" r="3" fill="#00d4ff"/></svg>
    </div>

    <div class="island" id="astove" style="left: 20%; top: 90%;">
        <svg width="30" height="25" viewBox="0 0 30 25"><path d="M5,5 Q15,0 25,5 Q30,15 20,20 Q10,25 5,15 Z" /></svg>
    </div>

    <div id="distance-hud">
        <div class="hud-label">LOGISTIQUE DE NAVIGATION</div>
        <div id="dist-display" class="hud-val">0 km</div>
        <div id="path-display" style="font-size: 0.65rem; color: #888;">Maintenez et reliez deux points.</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    const interactiveMap = document.getElementById('interactive-map-screen');
    
    let isDrawing = false;
    let startPoint = null;
    let currentMousePos = { x: 0, y: 0 };
    let endPoint = null;

    // --- NAVIGATION ---
    function handleEnter(e) { if (e.key === 'Enter') verifyID(); }
    function verifyID() {
        if (document.getElementById('boatID').value.trim() === "356") {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'grid';
        } else {
            alert("Accès refusé : ID Navire non reconnu.");
        }
    }
    function showInteractiveMap() {
        document.getElementById('auth-screen').style.display = 'none';
        interactiveMap.style.display = 'flex';
        resize();
    }

    // --- LOGIQUE TRACKING BATEAU (SANS ROTATION) ---
    const grid = { "A1": {x:58, y:55}, "C1": {x:66, y:55}, "C3": {x:66, y:73}, "B2": {x:62, y:65}, "A3": {x:58, y:73}, "A1_FIN": {x:58, y:55} };
    const path = ["A1", "C1", "C3", "B2", "A3", "A1_FIN"];

    async function runAnimation(btn) {
        document.querySelectorAll('.log-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const boat = document.getElementById('boat');
        boat.style.display = "block";
        for (let step of path) {
            boat.style.left = grid[step].x + "%";
            boat.style.top = grid[step].y + "%";
            boat.style.transform = `translate(-50%, -50%) rotate(0deg)`; // Reste droit
            await new Promise(resolve => setTimeout(resolve, 800));
        }
    }

    // --- LOGIQUE CARTE INTERACTIVE ---
    function resize() {
        canvas.width = interactiveMap.clientWidth;
        canvas.height = interactiveMap.clientHeight;
    }
    window.addEventListener('resize', resize);

    interactiveMap.addEventListener('mousedown', startTrace);
    interactiveMap.addEventListener('touchstart', (e) => startTrace(e.touches[0]));
    window.addEventListener('mousemove', moveTrace);
    window.addEventListener('touchmove', (e) => moveTrace(e.touches[0]));
    window.addEventListener('mouseup', endTrace);
    window.addEventListener('touchend', endTrace);

    function startTrace(e) {
        const island = e.target.closest('.island');
        if (island) {
            isDrawing = true;
            const containerRect = interactiveMap.getBoundingClientRect();
            const rect = island.getBoundingClientRect();
            // On calcule le centre EXACT de l'île par rapport au conteneur de la carte
            startPoint = { 
                id: island.id, 
                x: rect.left + rect.width / 2 - containerRect.left, 
                y: rect.top + rect.height / 2 - containerRect.top 
            };
            island.classList.add('active');
            endPoint = null;
        }
    }

    function moveTrace(e) {
        if (!isDrawing) return;
        const containerRect = interactiveMap.getBoundingClientRect();
        // Coordonnées souris relatives au conteneur
        currentMousePos = { 
            x: e.clientX - containerRect.left, 
            y: e.clientY - containerRect.top 
        };
        draw();
    }

    function endTrace() {
        if (!isDrawing) return;
        isDrawing = false;
        document.querySelectorAll('.island').forEach(isl => isl.classList.remove('active'));
        
        // Trouver l'élément sous la souris à la fin du tracé
        const element = document.elementFromPoint(
            currentMousePos.x + interactiveMap.getBoundingClientRect().left, 
            currentMousePos.y + interactiveMap.getBoundingClientRect().top
        );
        const island = element ? element.closest('.island') : null;

        if (island && island.id !== startPoint.id) {
            const containerRect = interactiveMap.getBoundingClientRect();
            const rect = island.getBoundingClientRect();
            // Centre exact de l'île de fin
            endPoint = { 
                id: island.id, 
                x: rect.left + rect.width / 2 - containerRect.left, 
                y: rect.top + rect.height / 2 - containerRect.top 
            };
            calculateDistance();
        } else {
            startPoint = null; // Tracé invalide
        }
        draw();
    }

    function calculateDistance() {
        // VERROU : Mahé ↔ Aldabra = 1150 km
        const isRef = (startPoint.id === 'mahe' && endPoint.id === 'aldabra') || (startPoint.id === 'aldabra' && endPoint.id === 'mahe');
        
        if (isRef) {
            document.getElementById('dist-display').innerText = "1150 km";
            document.getElementById('path-display').innerText = "VECTEUR ÉTALONNÉ : Aldabra / Mahé";
        } else {
            // Calcul proportionnel basé sur la référence Mahé-Aldabra
            const pA = document.getElementById('aldabra').getBoundingClientRect();
            const pM = document.getElementById('mahe').getBoundingClientRect();
            const containerRect = interactiveMap.getBoundingClientRect();
            
            const pxRef = Math.sqrt(Math.pow(pM.left - pA.left, 2) + Math.pow(pM.top - pA.top, 2));
            const pxTarget = Math.sqrt(Math.pow(endPoint.x - startPoint.x, 2) + Math.pow(endPoint.y - startPoint.y, 2));
            
            const realKm = Math.round(pxTarget * (1150 / pxRef));
            document.getElementById('dist-display').innerText = realKm + " km";
            document.getElementById('path-display').innerText = "Distance par triangulation satellite.";
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isDrawing && startPoint) {
            // Ligne de tracé active (pointillés bleu)
            ctx.beginPath(); ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            ctx.moveTo(startPoint.x, startPoint.y); ctx.lineTo(currentMousePos.x, currentMousePos.y); ctx.stroke();
        } else if (startPoint && endPoint) {
            // Ligne finale validée (pleine blanche, lueur bleue)
            ctx.beginPath(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([]);
            ctx.shadowBlur = 15; ctx.shadowColor = "#00d4ff";
            ctx.moveTo(startPoint.x, startPoint.y); ctx.lineTo(endPoint.x, endPoint.y); ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }
</script>

</body>
</html>
