<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cartographie - Lémuria Eden</title>
    <style>
        :root {
            --sidebar-width: 250px;
            --accent: #d4af37;
            --bg: #0a0a0c;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden; /* Empêche tout scroll global */
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: var(--sidebar-width);
            background: #151518;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 100;
            flex-shrink: 0;
        }

        h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 25px; text-transform: uppercase; }

        .btn-layer {
            background: #25252b;
            border: 1px solid #444;
            color: #aaa;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 4px;
            text-align: left;
        }

        .btn-layer.active { 
            background: var(--accent); 
            color: #000; 
            border-color: #fff;
        }

        /* --- ZONE DE LA CARTE --- */
        #map-viewport {
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Marge de sécurité autour de la carte */
            position: relative;
        }

        .map-wrapper {
            position: relative;
            /* Ces deux lignes assurent que l'image ne dépasse jamais l'écran */
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #base-map {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            /* Le calque prend exactement la taille affichée du plan de base */
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garde les proportions même en cas de décalage */
            cursor: move;
            opacity: 0.7;
            display: none;
            z-index: 10;
        }

        .layer.active {
            display: block;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Superposition SIG</h2>
    <button class="btn-layer" onclick="toggleLayer('flore')" id="btn-flore">CALQUE FLORE</button>
    <button class="btn-layer" onclick="toggleLayer('faune')" id="btn-faune">CALQUE FAUNE</button>
    
    <div style="margin-top:auto; font-size: 0.8rem; color:#666;">
        Maintenez le clic pour déplacer le calque actif.
    </div>
</div>

<div id="map-viewport">
    <div class="map-wrapper" id="container">
        <img src="plan.jpg" id="base-map">
        
        <img src="flore.png" id="layer-flore" class="layer">
        <img src="faune.png" id="layer-faune" class="layer">
    </div>
</div>

<script>
    const state = {
        active: null,
        flore: { x: 50, y: 40 }, // Décalage initial
        faune: { x: -40, y: 60 }
    };

    let isDragging = false;
    let startX, startY;

    function toggleLayer(layerId) {
        if (state.active && state.active !== layerId) {
            document.getElementById(`layer-${state.active}`).classList.remove('active');
            document.getElementById(`btn-${state.active}`).classList.remove('active');
        }

        const el = document.getElementById(`layer-${layerId}`);
        const btn = document.getElementById(`btn-${layerId}`);

        if (state.active === layerId) {
            el.classList.remove('active');
            btn.classList.remove('active');
            state.active = null;
        } else {
            state.active = layerId;
            el.classList.add('active');
            btn.classList.add('active');
            updatePos(el, state[layerId]);
        }
    }

    // Gestion du Drag
    window.addEventListener('mousedown', (e) => {
        if (state.active && e.target.id === `layer-${state.active}`) {
            isDragging = true;
            // On calcule le point de départ
            startX = e.clientX - state[state.active].x;
            startY = e.clientY - state[state.active].y;
            e.preventDefault();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        state[state.active].x = e.clientX - startX;
        state[state.active].y = e.clientY - startY;
        updatePos(document.getElementById(`layer-${state.active}`), state[state.active]);
    });

    window.addEventListener('mouseup', () => isDragging = false);

    function updatePos(el, pos) {
        el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
    }
</script>

</body>
</html>
