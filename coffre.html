<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>55 Investigations - Coffre du Directeur</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --line: #334155;
            --text: #f1f5f9;
            --accent: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 100%;
            background: #020617;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--line);
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .container { margin-top: 50px; text-align: center; }

        /* --- LA ROUE --- */
        .safe-box {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
            background: var(--panel);
            border-radius: 50%;
            border: 4px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .marker {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 30px;
            background: var(--text);
            z-index: 10;
            border-radius: 2px;
        }

        #wheel {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #020617;
            border: 2px solid var(--line);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .symbol {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            padding-top: 15px;
            font-size: 1.8rem;
            color: var(--accent);
        }

        /* --- CONTROLES --- */
        .controls {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .btn-nav {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            width: 65px; height: 65px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: background 0.2s;
        }

        .btn-nav:hover { background: var(--line); }

        .sequence-bar {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .slot {
            width: 45px; height: 45px;
            border-bottom: 2px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: var(--text);
            transition: all 0.3s;
        }

        #success-notif {
            display: none;
            margin-top: 40px;
            color: var(--success);
            border: 1px solid var(--success);
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            max-width: 420px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>UNITÉ DE STOCKAGE SÉCURISÉE - ARCHIVES E</header>

    <div class="container">
        
        <div class="safe-box">
            <div class="marker"></div>
            <div id="wheel"></div>
        </div>

        <div class="controls">
            <button class="btn-nav" onclick="rotate('left')">◀</button>
            <button class="btn-nav" onclick="rotate('right')">▶</button>
        </div>

        <div class="sequence-bar">
            <div class="slot" id="s0"></div>
            <div class="slot" id="s1"></div>
            <div class="slot" id="s2"></div>
            <div class="slot" id="s3"></div>
            <div class="slot" id="s4"></div>
        </div>

        <div id="success-notif">
            <b>MÉCANISME DÉBLOQUÉ</b><br>
            La serrure électronique vient de céder.<br>
            Ouvrez l'enveloppe E - COFFRE DU DIRECTEUR.
        </div>
    </div>

    <script>
        const zodiac = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
        const solution = [7, 2, 5, 0, 11]; // Scorpion, Gémeaux, Vierge, Bélier, Poissons

        const wheel = document.getElementById('wheel');
        let currentAngle = 0;
        let lastDir = null;
        let userInput = [];
        let currentPointedIndex = 0;
        let isUnlocked = false;

        // Initialisation
        zodiac.forEach((sym, i) => {
            const el = document.createElement('div');
            el.className = 'symbol';
            el.style.transform = `rotate(${i * 30}deg)`;
            el.innerText = sym;
            wheel.appendChild(el);
        });

        function rotate(dir) {
            if (isUnlocked) return;

            // 1. Capture sur changement de direction pour les 4 premiers
            if (lastDir !== null && lastDir !== dir) {
                capture(currentPointedIndex);
            }

            lastDir = dir;

            // 2. Mise à jour de la rotation
            if (dir === 'right') {
                currentAngle -= 30;
                currentPointedIndex = (currentPointedIndex + 1) % 12;
            } else {
                currentAngle += 30;
                currentPointedIndex = (currentPointedIndex - 1 + 12) % 12;
            }

            wheel.style.transform = `rotate(${currentAngle}deg)`;

            // 3. Vérification immédiate pour le 5ème signe
            // Si on a déjà 4 signes et qu'on arrive sur le 5ème correct
            if (userInput.length === 4 && currentPointedIndex === solution[4]) {
                // On attend la fin de l'animation de rotation (400ms) pour valider
                setTimeout(autoValidate, 400);
            } 
            // Si on change de direction une 5ème fois sur le mauvais signe : reset
            else if (userInput.length === 5) {
                reset();
            }
        }

        function capture(indexToRecord) {
            if (userInput.length >= 5) return;
            userInput.push(indexToRecord);
            updateUI();
        }

        function updateUI() {
            userInput.forEach((idx, i) => {
                const s = document.getElementById('s' + i);
                if (s) s.innerText = zodiac[idx];
            });
        }

        function autoValidate() {
            const isCorrect = userInput.length === 4 && 
                              userInput.every((val, i) => val === solution[i]) &&
                              currentPointedIndex === solution[4];

            if (isCorrect) {
                isUnlocked = true;
                // On affiche le dernier signe dans le slot
                document.getElementById('s4').innerText = zodiac[solution[4]];
                document.getElementById('success-notif').style.display = 'block';
            } else if (userInput.length >= 4) {
                // Si on a atteint le 5ème cran mais que la séquence globale est fausse
                // (On laisse le joueur finir son mouvement, le reset se fera au prochain clic ou si c'est faux)
                reset();
            }
        }

        function reset() {
            // Petit feedback visuel de rouge avant le reset
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => s.style.borderColor = "var(--error)");
            
            setTimeout(() => {
                userInput = [];
                lastDir = null;
                slots.forEach(s => {
                    s.innerText = "";
                    s.style.borderColor = "var(--line)";
                });
            }, 500);
        }
    </script>
</body>
</html>
