<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Dortoir - Carapace-Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1a1c23;
            --accent-color: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2d3748;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .main-container {
            width: 90%;
            max-width: 800px;
            margin-top: 50px;
            text-align: center;
        }

        /* --- SECTION CARAPACE DIGICODE --- */
        .carapace-section {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        p.instruction {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .carapace-wrapper {
            position: relative;
            display: inline-block;
        }

        .shell-img {
            max-height: 600px;
            max-width: 100%;
            display: block;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- ZONES CLIQUABLES INVISIBLES (Carte d'image) --- */
        /* Note : Les coordonnées sont des estimations basées sur une image affichée à max-height 600px.
           L'idéal est d'utiliser un outil de mappage d'image pour définir les polygones précis de chaque scute.
           J'ai simplifié en utilisant des rects pour les trois écailles centrales solution.
        */
        
        area {
            cursor: pointer;
            outline: none;
        }

        /* Effet visuel lors de la sélection (Difficile avec <map> pur, on change le message) */
        
        .control-panel {
            margin-top: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .selected-counter {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .btn-validate {
            width: 200px;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        .btn-validate:hover {
            background: var(--accent-color);
            color: #000;
        }

        #result-msg {
            margin-top: 25px;
            display: none;
            color: #48bb78;
            font-weight: bold;
            padding: 15px;
            border: 1px solid #48bb78;
            background: rgba(72, 187, 120, 0.1);
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

<header>
    <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
    <div style="font-weight: 800; letter-spacing: 2px; color: #fff;">DORTOIR DU PERSONNEL</div>
</header>

<div class="main-container">
    
    <div class="carapace-section">
        <h2>CARAPACE-CODE [ACCÈS BIOMÉTRIQUE]</h2>
        <p class="instruction">Identifiez la séquence correcte de scutes (écailles) pour valider l'accès.</p>
        
        <div class="carapace-wrapper">
            <img src="image_984db6.png" class="shell-img" usemap="#carapaceMap" alt="Digicode Carapace">
            
            <map name="carapaceMap">
                <area shape="rect" coords="310,130,470,200" alt="Central 1" onclick="selectScute('central1')">
                
                <area shape="rect" coords="310,200,470,310" alt="Central 2" onclick="selectScute('central2')">
                
                <area shape="rect" coords="310,310,470,420" alt="Central 3" onclick="selectScute('central3')">

                <area shape="rect" coords="200,200,310,310" alt="Costale" onclick="selectScute('costale1')">
                
                </map>
        </div>

        <div class="control-panel">
            <div class="selected-counter" id="counterMsg">Scutes sélectionnées : <span id="currentSelection"></span> / 3</div>
            <button class="btn-validate" onclick="validate()">Valider</button>
            <div id="result-msg">
                <i class="fas fa-check-circle" style="margin-right: 10px;"></i>ACCÈS AUTORISÉ.<br>Vous pouvez ouvrir l'enveloppe B - Dortoir du personnel.
            </div>
        </div>
    </div>

</div>

<script>
    let sequence = [];
    let isLocked = false;
    
    // SOLUTION : Central 1, Central 2, Central 3 (indices plausibles)
    const solutionSequence = ["central1", "central2", "central3"];

    function selectScute(id) {
        if (isLocked || sequence.length >= 3) return;
        
        sequence.push(id);
        updateUI();
        document.getElementById('result-msg').style.display = "none";
    }

    function updateUI() {
        const counter = document.getElementById('currentSelection');
        counter.textContent = sequence.length;
    }

    function validate() {
        if (sequence.length === 0) {
            alert("Veuillez sélectionner au moins une scute.");
            return;
        }

        if (sequence.length !== 3) {
            alert("Accès refusé. Séquence incorrecte (3 scutes requises).");
            reset();
            return;
        }

        // Vérification si la séquence est correcte (ordre et contenu)
        const isCorrect = sequence.length === solutionSequence.length && 
                          sequence.every((val, index) => val === solutionSequence[index]);

        if (isCorrect) {
            document.getElementById('result-msg').style.display = "block";
            isLocked = true; // Empêche d'autres clics
        } else {
            alert("Accès refusé. Séquence incorrecte.");
            reset();
        }
    }

    function reset() {
        sequence = [];
        updateUI();
        isLocked = false;
        document.getElementById('result-msg').style.display = "none";
    }
</script>

</body>
</html>
