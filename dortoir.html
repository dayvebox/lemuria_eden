<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Dortoir - BIOS-Shell V3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1a1c23;
            --accent-color: #00d4ff;
            --text-primary: #ffffff;
            --border-color: #2d3748;
            --scute-idle: #2d3748;
            --scute-active: #00d4ff;
            --error-color: #ff3e3e;
            --outline-color: #2a2f3a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .main-container {
            margin-top: 60px;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* --- SILHOUETTE DE LA TORTUE --- */
        .turtle-system {
            position: relative;
            display: inline-block;
            padding: 50px;
        }

        .head-outline {
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 50px; height: 70px;
            border: 2px solid var(--outline-color);
            border-radius: 25px 25px 10px 10px;
        }

        .tail-outline {
            position: absolute;
            bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid var(--outline-color);
        }

        .flipper { position: absolute; width: 60px; height: 90px; border: 2px solid var(--outline-color); }
        .f-tl { top: 60px; left: 0; border-radius: 100% 0 50% 50%; transform: rotate(-35deg); }
        .f-tr { top: 60px; right: 0; border-radius: 0 100% 50% 50%; transform: rotate(35deg); }
        .f-bl { bottom: 60px; left: 10px; border-radius: 50% 50% 0 100%; transform: rotate(25deg); }
        .f-br { bottom: 60px; right: 10px; border-radius: 50% 50% 100% 0%; transform: rotate(-25deg); }

        .shell-body {
            position: relative; z-index: 2;
            padding: 45px 35px;
            border: 2px solid var(--outline-color);
            border-radius: 110px;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: flex-start; gap: 10px;
        }

        /* --- ÉCAILLES --- */
        .column { display: flex; flex-direction: column; gap: 10px; }
        .column-center { margin-top: -35px; }

        .scute {
            width: 75px; height: 85px;
            background-color: var(--scute-idle);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s ease; border: none; outline: none;
        }
        .scute:hover { background-color: #3d495d; }
        .scute.active { background-color: var(--scute-active); box-shadow: 0 0 15px var(--accent-color); }
        .scute.error-flash { background-color: var(--error-color) !important; }

        /* --- UI --- */
        .controls { margin-top: 40px; }
        .btn-validate {
            padding: 12px 35px; background: transparent; border: 2px solid var(--accent-color);
            color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px;
            font-weight: bold; cursor: pointer; transition: 0.3s; margin: 5px;
        }
        .btn-validate:hover { background: var(--accent-color); color: #000; }
        .btn-reset { border-color: #4a5568; color: #4a5568; }

        #status-msg { margin-top: 25px; font-size: 0.85rem; height: 20px; letter-spacing: 1px; }
        #success-panel {
            display: none; background: rgba(72, 187, 120, 0.1); border: 1px solid #48bb78;
            padding: 20px; border-radius: 4px; margin-top: 25px; color: #48bb78;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
        <div style="font-weight: 800; letter-spacing: 2px;">IDENTIFICATION BIOMÉTRIQUE : DORTOIR</div>
    </header>

    <div class="main-container">
        
        <div class="turtle-system">
            <div class="head-outline"></div>
            <div class="flipper f-tl"></div>
            <div class="flipper f-tr"></div>
            <div class="flipper f-bl"></div>
            <div class="flipper f-br"></div>
            <div class="tail-outline"></div>

            <div class="shell-body">
                <div class="column">
                    <button class="scute" id="L1" onclick="press('L1')"></button>
                    <button class="scute" id="L2" onclick="press('L2')"></button>
                    <button class="scute" id="L3" onclick="press('L3')"></button>
                    <button class="scute" id="L4" onclick="press('L4')"></button>
                </div>
                <div class="column column-center">
                    <button class="scute" id="C1" onclick="press('C1')"></button>
                    <button class="scute" id="C2" onclick="press('C2')"></button>
                    <button class="scute" id="C3" onclick="press('C3')"></button>
                    <button class="scute" id="C4" onclick="press('C4')"></button>
                    <button class="scute" id="C5" onclick="press('C5')"></button>
                </div>
                <div class="column">
                    <button class="scute" id="R1" onclick="press('R1')"></button>
                    <button class="scute" id="R2" onclick="press('R2')"></button>
                    <button class="scute" id="R3" onclick="press('R3')"></button>
                    <button class="scute" id="R4" onclick="press('R4')"></button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div id="status-msg">SÉLECTION : <span id="seq-display">VIDE</span></div>
            <button class="btn-validate" onclick="validate()">DÉVERROUILLER</button>
            <button class="btn-validate btn-reset" onclick="reset()">RÉINITIALISER</button>
            
            <div id="success-panel">
                <i class="fas fa-check-circle"></i> STRUCTURE VALIDÉE<br>
                <b>Ouvrez l'enveloppe : Dortoir du Personnel</b>
            </div>
        </div>
    </div>

    <script>
        let currentSelection = [];
        let isProcessing = false;
        
        // Nouvelle solution
        const solution = ["C1", "L3", "R2"];

        function press(id) {
            if (isProcessing) return;
            const btn = document.getElementById(id);
            
            if (currentSelection.includes(id)) {
                currentSelection = currentSelection.filter(sid => sid !== id);
                btn.classList.remove('active');
            } else {
                if (currentSelection.length >= 3) return;
                currentSelection.push(id);
                btn.classList.add('active');
            }
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('seq-display');
            display.innerText = currentSelection.length > 0 ? currentSelection.join(' - ') : "VIDE";
        }

        function reset() {
            document.querySelectorAll('.scute').forEach(s => {
                s.classList.remove('active', 'error-flash');
            });
            currentSelection = [];
            isProcessing = false;
            updateDisplay();
            document.getElementById('status-msg').innerText = "SÉLECTION : VIDE";
            document.getElementById('status-msg').style.color = "inherit";
        }

        function validate() {
            if (isProcessing || currentSelection.length === 0) return;
            isProcessing = true;

            // Vérification : les deux tableaux doivent contenir les mêmes éléments (l'ordre n'importe pas)
            const isCorrect = currentSelection.length === solution.length && 
                              solution.every(val => currentSelection.includes(val));

            if (isCorrect) {
                document.getElementById('success-panel').style.display = 'block';
                document.getElementById('status-msg').style.display = 'none';
            } else {
                document.getElementById('status-msg').innerText = "STRUCTURE NON RECONNUE";
                document.getElementById('status-msg').style.color = "var(--error-color)";
                currentSelection.forEach(id => document.getElementById(id).classList.add('error-flash'));
                setTimeout(reset, 1200);
            }
        }
    </script>
</body>
</html>
