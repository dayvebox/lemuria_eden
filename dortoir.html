<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Dortoir - BIOS-Shell V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1a1c23;
            --accent-color: #00d4ff;
            --text-primary: #ffffff;
            --border-color: #2d3748;
            --scute-idle: #2d3748;
            --scute-active: #00d4ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .main-container {
            margin-top: 50px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        /* --- LE DIGICODE TORTUE --- */
        .shell-keypad {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            padding: 40px;
            background: radial-gradient(circle, #1a1c23 0%, #0b0c10 100%);
            border-radius: 50% 50% 40% 40%; /* Forme de carapace */
            border: 2px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Surélévation de la colonne centrale */
        .column-center {
            margin-top: -30px;
        }

        /* Style des écailles (Hexagones) */
        .scute {
            width: 80px;
            height: 90px;
            background-color: var(--scute-idle);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            color: rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .scute:hover {
            background-color: #3d495d;
            transform: scale(1.05);
        }

        .scute.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-color);
            color: #000;
        }

        /* --- CONTRÔLES --- */
        .controls {
            margin-top: 40px;
        }

        .btn-validate {
            padding: 12px 40px;
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-validate:hover {
            background: var(--accent-color);
            color: #000;
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        #success-panel {
            display: none;
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid #48bb78;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            color: #48bb78;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
        <div style="font-weight: 800; letter-spacing: 2px;">SYSTÈME D'ACCÈS DORTOIR</div>
    </header>

    <div class="main-container">
        <h2 style="font-size: 0.8rem; color: var(--accent-color); letter-spacing: 3px;">SÉQUENCE BIOMÉTRIQUE REQUISE</h2>
        
        <div class="shell-keypad">
            <div class="column">
                <button class="scute" id="L1" onclick="press('L1')"></button>
                <button class="scute" id="L2" onclick="press('L2')"></button>
                <button class="scute" id="L3" onclick="press('L3')"></button>
                <button class="scute" id="L4" onclick="press('L4')"></button>
            </div>

            <div class="column column-center">
                <button class="scute" id="C1" onclick="press('C1')"></button>
                <button class="scute" id="C2" onclick="press('C2')"></button>
                <button class="scute" id="C3" onclick="press('C3')"></button>
                <button class="scute" id="C4" onclick="press('C4')"></button>
                <button class="scute" id="C5" onclick="press('C5')"></button>
            </div>

            <div class="column">
                <button class="scute" id="R1" onclick="press('R1')"></button>
                <button class="scute" id="R2" onclick="press('R2')"></button>
                <button class="scute" id="R3" onclick="press('R3')"></button>
                <button class="scute" id="R4" onclick="press('R4')"></button>
            </div>
        </div>

        <div class="controls">
            <div id="status-msg">Séquence : <span id="seq-display">---</span></div>
            <button class="btn-validate" onclick="validate()">Valider l'accès</button>
            <button class="btn-validate" style="border-color: #666; color: #666; margin-left: 10px;" onclick="reset()">Réinitialiser</button>
            
            <div id="success-panel">
                <i class="fas fa-unlock-alt"></i> ACCÈS DORTOIR DÉVERROUILLÉ<br>
                Vous pouvez maintenant ouvrir l'enveloppe : <b>Dortoir du Personnel</b>.
            </div>
        </div>
    </div>

    <script>
        let currentSequence = [];
        // SOLUTION : Haut-Milieu, Centre, Bas-Milieu (C1, C3, C5)
        const solution = ["C1", "C3", "C5"];

        function press(id) {
            if (currentSequence.includes(id)) return;
            if (currentSequence.length >= 3) return;

            currentSequence.push(id);
            document.getElementById(id).classList.add('active');
            document.getElementById('seq-display').innerText = currentSequence.join(' - ');
        }

        function reset() {
            currentSequence.forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            currentSequence = [];
            document.getElementById('seq-display').innerText = "---";
            document.getElementById('status-msg').style.color = "inherit";
        }

        function validate() {
            if (JSON.stringify(currentSequence) === JSON.stringify(solution)) {
                document.getElementById('success-panel').style.display = 'block';
                document.getElementById('status-msg').style.display = 'none';
            } else {
                document.getElementById('status-msg').innerText = "ERREUR DE SÉQUENCE - ACCÈS REFUSÉ";
                document.getElementById('status-msg').style.color = "#ff3e3e";
                setTimeout(reset, 1000);
            }
        }
    </script>
</body>
</html>
