<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Dortoir - 55 Investigations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1a1c23;
            --accent-color: #00d4ff;
            --text-primary: #ffffff;
            --border-color: #2d3748;
            --btn-active: #00d4ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            margin-top: 50px;
            width: 90%;
            max-width: 1000px;
        }

        /* --- DIGICODE --- */
        .keypad-section {
            text-align: center;
            background: var(--panel-color);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 15px;
            margin-bottom: 30px;
        }

        .key-btn {
            width: 80px;
            height: 80px;
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn.active {
            background: var(--accent-color);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        /* --- RÉFÉRENCE CARAPACE --- */
        .reference-section {
            text-align: center;
        }

        .shell-container {
            position: relative;
            width: 280px;
            height: 280px;
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell-img {
            width: 200px;
            opacity: 0.7;
        }

        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid-overlay div {
            border: 1px dashed rgba(0, 212, 255, 0.2);
        }

        .btn-validate {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-validate:hover {
            background: var(--accent-color);
            color: #000;
        }

        #result-msg {
            margin-top: 20px;
            display: none;
            color: #48bb78;
            font-weight: bold;
            padding: 15px;
            border: 1px solid #48bb78;
            background: rgba(72, 187, 120, 0.1);
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
    <div style="font-weight: 800; letter-spacing: 2px;">DORTOIR DU PERSONNEL</div>
</header>

<div class="main-container">
    
    <div class="keypad-section">
        <h3 style="margin-top:0; font-size: 0.9rem; color: var(--accent-color);">DIGICODE SÉCURISÉ</h3>
        <div class="grid-3x3" id="keypad">
            <button class="key-btn" onclick="toggleKey(0)"></button>
            <button class="key-btn" onclick="toggleKey(1)"></button>
            <button class="key-btn" onclick="toggleKey(2)"></button>
            <button class="key-btn" onclick="toggleKey(3)"></button>
            <button class="key-btn" onclick="toggleKey(4)"></button>
            <button class="key-btn" onclick="toggleKey(5)"></button>
            <button class="key-btn" onclick="toggleKey(6)"></button>
            <button class="key-btn" onclick="toggleKey(7)"></button>
            <button class="key-btn" onclick="toggleKey(8)"></button>
        </div>
        <button class="btn-validate" onclick="validate()">Valider</button>
        <div id="result-msg">
            ACCÈS AUTORISÉ.<br>Vous pouvez ouvrir l'enveloppe B - Dortoir du personnel.
        </div>
    </div>

    <div class="reference-section">
        <h3 style="margin-top:0; font-size: 0.9rem; color: #666;">RÉFÉRENCE SYSTÈME</h3>
        <div class="shell-container">
            <img src="image_98b2d3.png" class="shell-img" alt="Schéma carapace">
            <div class="grid-overlay">
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
            </div>
        </div>
        <p style="font-size: 0.7rem; color: #444; margin-top: 10px;">Corrélation biométrique requise</p>
    </div>

</div>

<script>
    let activeKeys = [false, false, false, false, false, false, false, false, false];
    
    // SOLUTION : Colonne centrale (indices 1, 4, 7) basée sur la "colonne vertébrale" de la carapace
    const solution = [1, 4, 7];

    function toggleKey(index) {
        activeKeys[index] = !activeKeys[index];
        const buttons = document.querySelectorAll('.key-btn');
        buttons[index].classList.toggle('active');
        document.getElementById('result-msg').style.display = "none";
    }

    function validate() {
        const currentlyActive = activeKeys
            .map((val, idx) => val ? idx : null)
            .filter(val => val !== null);
        
        // Vérification si les longueurs correspondent et si chaque index de la solution est présent
        const isCorrect = currentlyActive.length === solution.length && 
                          solution.every(val => currentlyActive.includes(val));

        if (isCorrect) {
            document.getElementById('result-msg').style.display = "block";
        } else {
            alert("Accès refusé. Schéma incorrect.");
            // Reset optionnel pour la difficulté
        }
    }
</script>

</body>
</html>
