<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>55 Investigation - Hub Tactique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0b10;
            --card-bg: #161a23;
            --accent: #00e5ff; /* Bleu "Hacker" */
            --gold: #d4af37; /* Optionnel pour le côté luxe */
            --text: #e0e0e0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
            width: 100%;
            background: linear-gradient(to bottom, #10121a, var(--bg));
        }

        h1 {
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0;
        }

        .main-hub {
            max-width: 1100px;
            width: 90%;
            padding: 40px 0;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        @media (min-width: 768px) {
            .main-hub { grid-template-columns: 2fr 1fr; }
        }

        .category-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }

        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid #2a2f3a;
            padding: 20px;
            text-decoration: none;
            color: var(--text);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            text-align: center;
        }

        .link-card:hover {
            border-color: var(--accent);
            background: #1c222d;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.1);
        }

        .link-card i {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .link-card span { font-size: 0.9rem; font-weight: 500; }

        .resource-card { border-left: 4px solid var(--gold); }
        .resource-card i { color: var(--gold); }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-shield-halved"></i> 55 Investigation - Réseau Aldabra</h1>
</header>

<div class="main-hub">
    <section>
        <div class="category-title">Déverrouiller une enveloppe</div>
        <div class="grid-links">
            <a href="reception.html" class="link-card">
                <i class="fas fa-desktop"></i>
                <span>PC de la réception</span>
            </a>
            <a href="dortoir.html" class="link-card">
                <i class="fas fa-bed"></i>
                <span>Dortoir du personnel</span>
            </a>
            <a href="police.html" class="link-card">
                <i class="fas fa-folder-open"></i>
                <span>Dossier de police</span>
            </a>
            <a href="abri.html" class="link-card">
                <i class="fas fa-cloud-bolt"></i>
                <span>Abri anti-tempête</span>
            </a>
            <a href="satellite.html" class="link-card">
                <i class="fas fa-satellite-dish"></i>
                <span>Téléphone satellite</span>
            </a>
            <a href="coffre.html" class="link-card">
                <i class="fas fa-vault"></i>
                <span>Coffre du directeur</span>
            </a>
            <a href="usb.html" class="link-card">
                <i class="fas fa-usb"></i>
                <span>Clé USB</span>
            </a>
        </div>
    </section>

    <section>
        <div class="category-title">Ressources Additionnelles</div>
        <div class="grid-links">
            <a href="casiers.html" class="link-card resource-card">
                <i class="fas fa-fingerprint"></i>
                <span>Casiers judiciaires</span>
            </a>
            <a href="carte.html" class="link-card resource-card">
                <i class="fas fa-map-marked-alt"></i>
                <span>Carte maritime</span>
            </a>
        </div>
    </section>
</div>

</body>
</html>
