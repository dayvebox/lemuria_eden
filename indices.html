<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>55 Investigations - Centre d'Indices</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1a1c23;
            --accent-color: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2d3748;
            --sub-panel-color: #0f1115;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            width: 100%;
            background-color: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .logo-55 {
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .home-btn {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-50%);
            width: 45px; height: 45px;
            background-color: var(--panel-color);
            color: var(--text-primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }
        .home-btn:hover { background-color: var(--accent-color); color: #000; }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 40px;
        }

        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- ACCORDÉONS PRINCIPAUX (NIVEAU 1) --- */
        .main-accordion {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .main-header {
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .main-header:hover {
            background: #232631;
        }

        .main-title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .main-icon {
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .main-content {
            display: none; /* Caché par défaut */
            background: var(--sub-panel-color);
            border-top: 1px solid var(--border-color);
            padding: 20px;
        }

        /* État actif Niveau 1 */
        .main-accordion.active .main-content {
            display: block;
        }
        .main-accordion.active .main-icon {
            transform: rotate(180deg);
        }

        /* --- ACCORDÉONS IMBRIQUÉS (NIVEAU 2) --- */
        .sub-accordion {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 8px;
            background: #16181f;
        }

        .sub-accordion:last-child {
            margin-bottom: 0;
        }

        .sub-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .sub-header:hover {
            color: var(--text-primary);
        }

        .sub-icon {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .sub-content {
            display: none; /* Caché par défaut */
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            background: #0d0e12;
        }

        /* État actif Niveau 2 */
        .sub-accordion.active .sub-content {
            display: block;
        }
        .sub-accordion.active .sub-header {
            color: var(--accent-color);
        }
        .sub-accordion.active .sub-icon {
            transform: rotate(180deg);
        }

    </style>
</head>
