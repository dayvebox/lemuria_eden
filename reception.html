<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login - Lémuria Eden</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .home-btn {
    position: fixed; /* Reste en place au scroll */
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    background-color: #1e293b; /* Couleur sombre pro */
    color: #f1f5f9;
    border-radius: 50%; /* Bouton rond */
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    z-index: 9999; /* Toujours au premier plan */
    border: 1px solid #334155;
    transition: all 0.3s ease;
}

.home-btn:hover {
    background-color: #38bdf8; /* Devient bleu au survol */
    color: #0f172a;
    transform: scale(1.1);
}
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Arrière-plan avec image des Seychelles */
        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1589553416260-171755e37a8f?auto=format&fit=crop&q=80&w=1920');
            filter: blur(4px);
            height: 100%; 
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            transform: scale(1.1);
        }

        /* Overlay sombre */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 350px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.8s ease-out;
        }

        .user-icon {
            font-size: 4rem;
            color: white;
            margin-bottom: 20px;
        }

        h2 {
            color: white;
            font-weight: 300;
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 80%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background: #00e5ff;
            color: #0a0b10;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #00b8cc; }

        #success-msg {
            display: none;
            margin-top: 25px;
            color: #00ff41; /* Vert terminal */
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            border-left: 5px solid #00ff41;
        }

        /* Icône Home */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%;
            transition: 0.3s;
        }
        .home-btn:hover { background: rgba(0,0,0,0.6); transform: scale(1.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn" title="Retour à l'accueil">
    <i class="fas fa-home"></i>
</a>

    <div class="bg-image"></div>
    <a href="index.html" class="home-btn" title="Retour au Hub"><i class="fas fa-home"></i></a>

    <div class="overlay">
        <div class="login-box">
            <div class="user-icon"><i class="fas fa-user-circle"></i></div>
            <h2>Session Administrateur<br>Lémuria Eden</h2>
            
            <input type="password" id="passInput" placeholder="Entrez le mot de passe">
            <br>
            <button onclick="checkPass()">CONNEXION</button>

            <div id="success-msg">
                <i class="fas fa-check-circle"></i><br>
                Accès autorisé.<br>Vous pouvez ouvrir l'enveloppe A - PC de la réception.
            </div>
        </div>
    </div>

    <script>
        function checkPass() {
            const val = document.getElementById('passInput').value;
            const msg = document.getElementById('success-msg');
            if (val === "202609L21D27") {
                msg.style.display = "block";
            } else {
                alert("Mot de passe incorrect.");
            }
        }
    </script>

</body>
</html>
