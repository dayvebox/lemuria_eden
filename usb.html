<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>55 Investigations - USB DECRYPT</title>

    <style>
		.home-btn {
    position: fixed; /* Reste en place au scroll */
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    background-color: #1e293b; /* Couleur sombre pro */
    color: #f1f5f9;
    border-radius: 50%; /* Bouton rond */
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    z-index: 9999; /* Toujours au premier plan */
    border: 1px solid #334155;
    transition: all 0.3s ease;
}

.home-btn:hover {
    background-color: #38bdf8; /* Devient bleu au survol */
    color: #0f172a;
    transform: scale(1.1);
}
        :root {
            --hacker-green: #00ff41;
            --hacker-dark: #0a0a0a;
            --hacker-dim: #003b00;
        }

        body {
            background-color: var(--hacker-dark);
            color: var(--hacker-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #terminal {
            max-width: 850px;
            width: 100%;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--hacker-green);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* --- FORMULAIRE --- */
        #login-area {
            display: none;
            margin-top: 20px;
            border-top: 1px solid var(--hacker-dim);
            padding-top: 20px;
        }

        .input-row {
            margin: 15px 0;
            display: flex;
            align-items: center;
        }

        label { margin-right: 15px; font-weight: bold; }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--hacker-dim);
            color: var(--hacker-green);
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            width: 300px;
            letter-spacing: 2px;
        }

        input:focus { border-color: var(--hacker-green); }

        .btn-decrypt {
            background: var(--hacker-green);
            color: black;
            border: none;
            padding: 10px 25px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .btn-decrypt:hover { background: white; }

        #error-msg {
            color: #ff3e3e;
            display: none;
            margin-top: 15px;
            font-weight: bold;
        }

        /* --- LISTE AUDIO --- */
        #audio-vault {
            display: none;
            margin-top: 30px;
            animation: fadeIn 1s;
        }

        .audio-item {
            background: #111;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--hacker-dim);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        audio {
            width: 100%;
            filter: invert(100%) hue-rotate(90deg) brightness(1.5);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
<a href="index.html" class="home-btn" title="Retour à l'accueil">
    <i class="fas fa-home"></i>
</a>

        </div>
        <button class="btn-decrypt" onclick="verifyAccess()">Lancer le décryptage</button>
        <div id="error-msg">ACCÈS REFUSÉ : SIGNATURE NUMÉRIQUE INVALIDE. RÉESAYEZ.</div>
    </div>
